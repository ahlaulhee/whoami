# ~/.config/mango/config.conf
# Mango 0.18.5. Saved changes are applied at once (auto_reload_config=1 is
# the default). Check the file without starting Mango:
#   mango -c ~/.config/mango/config.conf -p

# ---------------------------------------------------------------------------
# Monitors
# Names are regexes, so anchor them. Replace DP-1/DP-2 with what
# `wlr-randr` or `mmsg get all-monitors` prints for your outputs.
# vrr:0 here; VRR is switched on only for fullscreen windows (window rule
# below). Keep x/y non-negative (XWayland input bug).
# ---------------------------------------------------------------------------
monitor_rule=name:^DP-1$,width:1920,height:1080,refresh:144,x:0,y:0,scale:1,vrr:0
monitor_rule=name:^DP-2$,width:2560,height:1440,refresh:240,x:1920,y:0,scale:1,vrr:0,primary:1

# ---------------------------------------------------------------------------
# Tags and layouts: scroller everywhere
# ---------------------------------------------------------------------------
# Tags 1-4 live on the 27" (DP-2) and 5-8 on the 24" (DP-1); see the binds.
tag_num=8
tag_rule=id:*,layout_name:scroller
circle_layout=scroller,tile,monocle
# No tab bar over stacked windows in monocle.
monocle_tab_mode=0

# New windows take 80% of the width; Super+r cycles through the presets.
scroller_default_proportion=0.8
scroller_proportion_preset=0.5,0.8,1.0
# A lone window fills the screen.
scroller_ignore_proportion_single=1
# The strip scrolls only as far as needed to show the focused column, so two
# columns that fit on screen (e.g. both at 0.5) stay side by side.
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=0

# ---------------------------------------------------------------------------
# Keyboard, mouse, cursor
# ---------------------------------------------------------------------------
xkb_rules_layout=us,latam
repeat_rate=25
repeat_delay=600
mouse_accel_profile=1
cursor_theme=Adwaita
cursor_size=24
# Focus changes only on click or with the keyboard, never by hovering.
sloppy_focus=0
warp_cursor=1
# No resizing by dragging a window edge: it grabs clicks meant for scrollbars
# at the window's side. Super+right drag and Super+r still resize.
enable_border_resize=0

# ---------------------------------------------------------------------------
# Idle: a focused fullscreen window counts as activity (games played with a
# controller), and inhibitors from hidden windows count too (video on
# another tag), like dwl's bypass_surface_visibility.
# ---------------------------------------------------------------------------
idle_inhibit_when_fullscreen=1
idle_inhibit_ignore_visible=1

# ---------------------------------------------------------------------------
# Look: Paradise, square corners, short animations, no other effects
# Colours are 0xRRGGBBAA.
# border_radius=0: rounded corners render jagged on the NVIDIA driver
# (mango#1387, scenefx#177).
# ---------------------------------------------------------------------------
border_px=2
border_radius=0
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
root_color=0x151515ff
border_color=0x424242ff
focus_color=0x8da3b9ff
urgent_color=0xb66467ff
scratchpad_color=0xa988b0ff
global_color=0x8aa6a2ff
overlay_color=0xd9bc8cff
maximized_screen_color=0x8c977dff

# Jump mode (Super+Tab): one-key hints over every window.
jump_label_decorate_fg_color=0xe8e3e3ff
jump_label_decorate_bg_color=0x151515ff
jump_label_decorate_focus_fg_color=0x151515ff
jump_label_decorate_focus_bg_color=0x8da3b9ff
jump_label_decorate_border_color=0x424242ff
jump_label_decorate_border_width=2
jump_label_decorate_corner_radius=0
jump_label_decorate_font_desc=Maple Mono Bold 16

# Windows fade in and out, and the scroller and tag switches slide, all in
# 150 ms with Mango's default ease-out curve. Layer surfaces (bar, OSD,
# notifications, menu, slurp) appear at once.
animations=1
layer_animations=0
animation_type_open=fade
animation_type_close=fade
animation_duration_move=150
animation_duration_open=150
animation_duration_close=150
animation_duration_tag=150
animation_duration_focus=0
tag_animation_direction=1
blur=0
blur_layer=0
shadows=0
layer_shadows=0

# ---------------------------------------------------------------------------
# Autostart
# Mango already exports its environment to systemd/D-Bus and starts
# mango-session.target, so no dbus-update-activation-environment line.
# qs is the bar, the volume OSD, notifications and the polkit agent.
# wl-clip-persist keeps the clipboard after the program you copied from
# closes. cliphist-store is cliphist store without the Spectre passwords.
# ---------------------------------------------------------------------------
exec_once=swaybg -c 151515 -i ~/.local/share/wallpapers/wallpaper.jpg -m fill
exec_once=wl-clip-persist --clipboard regular
exec_once=wl-paste --watch ~/.local/bin/cliphist-store
exec_once=/usr/local/bin/mango-idle
exec_once=qs
exec_once=discord
# Every monitor starts on tag 1: move the 24" to its first tag, 5, give focus
# back to the 27", and only then start Firefox, so it opens on tag 1 there.
# Discord is placed by a window rule below.
exec_once=mmsg dispatch viewcrossmon,5,DP-1; mmsg dispatch focusmon,DP-2; firefox

# Every program in the session gets this: Neovim as the editor instead of
# Fedora's nano.
env=EDITOR,nvim

# ---------------------------------------------------------------------------
# Window rules
# ---------------------------------------------------------------------------
# foot is the terminal: a GUI program started from it takes its place
# (swallow). foot itself never swallows foot.
window_rule=is_term:1,app_id:^foot$
# VRR only while a window is fullscreen (monitor rules have vrr:0).
window_rule=vrr_only_fullscreen:1,app_id:.*
# Steam's friends list and small dialogs float; games start fullscreen anyway.
window_rule=is_floating:1,app_id:^steam$,title:^(Friends List|Steam Settings)$
# Games launched from Steam: the cursor stays inside the game's window, and
# while the game has focus the screen doesn't lock or turn off, even when it's
# windowed and played with a controller.
window_rule=confine_pointer:1,app_id:^steam_app_.*$
window_rule=idle_inhibit_when_focus:1,app_id:^(steam_app_.*|gamescope)$
# Games skip every animation, so they're never drawn at an in-between size.
window_rule=no_animation:1,app_id:^(steam_app_.*|gamescope)$
# Steam and Discord asking for attention mark their window urgent instead of
# switching to its tag.
window_rule=is_tag_silent:1,app_id:^(steam|discord)$
# Discord always opens on tag 5 of the 24", without taking focus.
window_rule=tags:5,monitor:DP-1,is_open_silent:1,app_id:^discord$

# Tearing in fullscreen games, to try: lower latency on the 240 Hz monitor.
# Some cards also need the env line, and Mango must be restarted for it.
#allow_tearing=2
#window_rule=force_tearing:1,app_id:^steam_app_.*$
#env=WLR_DRM_NO_ATOMIC,1

# ---------------------------------------------------------------------------
# Keybinds  (bind=MODS,KEY,dispatcher,args)
# A "## Name" line starts a category in the keymap cheatsheet
# (Super+Shift+/), which reads the binds from this file.
# ---------------------------------------------------------------------------
## Programs
bind=SUPER,Return,spawn,foot
bind=SUPER,b,spawn,qs ipc call bar toggle
bind=SUPER,o,spawn,qs ipc call audio next
bind=SUPER,p,spawn,qs ipc call menu run
bind=SUPER,n,spawn,foot -e yazi
bind=SUPER,v,spawn,qs ipc call menu clipboard
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=NONE,Print,spawn_shell,grim "$HOME/Pictures/$(date +%F_%H-%M-%S).png"
bind=SUPER+SHIFT,x,spawn,grimpicker --copy --notify
bind=SUPER+SHIFT,i,spawn,qs ipc call idle toggle
bind=SUPER+SHIFT,slash,spawn,qs ipc call keymaps toggle

# Lock. bindl also works while locked: if the lock process dies, the session
# stays locked on a gray screen and this starts a new lock that takes over.
bindl=SUPER,Escape,spawn,/usr/local/bin/mango-lock

# Volume (l = also works on the lock screen)
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
axisbind=SUPER,UP,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
axisbind=SUPER,DOWN,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

## Windows
bind=SUPER,w,killclient,
bind=SUPER+SHIFT,c,killclient,
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
# Stack the window into the neighbouring column, or pull it out again
bind=SUPER+CTRL,h,scroller_stack,left
bind=SUPER+CTRL,l,scroller_stack,right
bind=SUPER+CTRL,k,scroller_stack,up
bind=SUPER+CTRL,j,scroller_stack,down
bind=SUPER,s,focuslast,
bind=SUPER,r,switch_proportion_preset,next
bind=SUPER,e,set_proportion,1.0
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefloating,
bind=SUPER+SHIFT,e,togglemaximizescreen,
bind=SUPER,g,toggleglobal,
bind=SUPER+SHIFT,g,toggleoverlay,
bind=SUPER,Tab,togglejump,
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# Dragging a tiled window onto another swaps them.
drag_tile_to_tile=1

# Scratchpad: Super+Shift+minus hides the window there, Super+minus shows or
# hides the scratchpad, Super+Ctrl+minus puts the window back on the tag.
bind=SUPER+SHIFT,minus,minimized,
bind=SUPER,minus,toggle_scratchpad,
bind=SUPER+CTRL,minus,restore_minimized,

## Layouts
bind=SUPER,c,setlayout,scroller
bind=SUPER,t,setlayout,tile
bind=SUPER,m,setlayout,monocle
bind=SUPER+SHIFT,space,switch_layout,
bind=SUPER,space,switch_keyboard_layout,
bind=SUPER+ALT,0,togglegaps,

## Tags
# 1-4 on the 27" (DP-2), 5-8 on the 24" (DP-1). Super+N shows tag N
# on its monitor and focuses it; on the tag already shown it goes back to that
# monitor's previous tag (mango-tag). Super+Shift+N moves the window there.
bind=SUPER,1,spawn,/usr/local/bin/mango-tag 1
bind=SUPER,2,spawn,/usr/local/bin/mango-tag 2
bind=SUPER,3,spawn,/usr/local/bin/mango-tag 3
bind=SUPER,4,spawn,/usr/local/bin/mango-tag 4
bind=SUPER,5,spawn,/usr/local/bin/mango-tag 5
bind=SUPER,6,spawn,/usr/local/bin/mango-tag 6
bind=SUPER,7,spawn,/usr/local/bin/mango-tag 7
bind=SUPER,8,spawn,/usr/local/bin/mango-tag 8
bind=SUPER+SHIFT,1,tagcrossmon,1,DP-2
bind=SUPER+SHIFT,2,tagcrossmon,2,DP-2
bind=SUPER+SHIFT,3,tagcrossmon,3,DP-2
bind=SUPER+SHIFT,4,tagcrossmon,4,DP-2
bind=SUPER+SHIFT,5,tagcrossmon,5,DP-1
bind=SUPER+SHIFT,6,tagcrossmon,6,DP-1
bind=SUPER+SHIFT,7,tagcrossmon,7,DP-1
bind=SUPER+SHIFT,8,tagcrossmon,8,DP-1

## Monitors
# Super+period focuses the other monitor, Super+Shift+period moves the
# window there. h/j/k/l never leave the monitor.
bind=SUPER,period,focusmon,next
bind=SUPER+SHIFT,period,tagmon,next

## Mango itself
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,q,quit
